<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>집단유전학 발표자료 (2026-09-30)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }
        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge {
            background: #2563eb;
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        h1 {
            font-size: 1rem;
            font-weight: 600;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }
        .btn-secondary:hover {
            background: #475569;
        }
        .pdf-container {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .fallback-msg {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <header>
        <div class="title-group">
            <span class="badge">PDF Slides</span>
            <h1>집단유전학 세미나 발표자료 (2026-09-30)</h1>
        </div>
        <div class="actions">
            <a href="../" class="btn btn-secondary">← 목록으로</a>
            <a href="presentation.pdf" target="_blank" class="btn btn-primary">새 창으로 열기 / 다운로드</a>
        </div>
    </header>

    <div class="pdf-container">
        <!-- #toolbar=1&navpanes=0 옵션: 썸네일 사이드바 숨기고 깔끔한 툴바만 유지 -->
        <iframe src="presentation.pdf#toolbar=1&navpanes=0" type="application/pdf">
            <div class="fallback-msg">
                <p>브라우저에서 직접 PDF를 미리 볼 수 없습니다.</p>
                <a href="presentation.pdf" class="btn btn-primary">PDF 직접 다운로드하기</a>
            </div>
        </iframe>
    </div>
</body>
</html>
